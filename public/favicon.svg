<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="KN Builders">
  <title>KN Builders</title>
  <!-- Favicon: the KN monogram on a charcoal tile. The outline frame is dropped
       and the letterforms sit on a solid ground so the mark stays readable at
       16–32px, where the framed version closes up. -->
  <rect width="120" height="120" rx="22" fill="#2e2a26" />
  <g transform="translate(60 60) scale(0.82) translate(-60 -60)">
    <!-- N in cream for contrast on the dark tile -->
    <g fill="#faf6ef">
      <path d="M7.2 7.2 H26 L51 46 V54.5 L33.5 39.5 V51 L7.2 51 Z" />
      <path d="M59.5 55.5 L90 83 V112.8 L62.5 84.5 Z" />
      <rect x="90" y="7.2" width="23.3" height="105.6" />
    </g>
    <!-- K in brand terracotta -->
    <g fill="#c9591f">
      <path d="M84.9 16.5 V43.5 L36.5 90 L21.5 74.5 Z" />
      <path d="M6.8 47 H30.5 V112.8 H6.8 Z" />
      <path d="M30.5 65.5 L79.1 112.8 H53.1 L30.5 89.5 Z" />
    </g>
  </g>
</svg>
